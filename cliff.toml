# Maintainer preparation and CI require git-cliff 2.14.1.
[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Acrazie/forgix/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
# Ranges and release headings belong to the two-plane release orchestrator.
tag_pattern = "^$"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/Acrazie/forgix/pull/${1}))" },
]
commit_parsers = [
  { message = '^chore\(release\):', skip = true },
  { message = '^feat', group = "Features" },
  { message = '^fix', group = "Bug fixes" },
  { message = '^perf', group = "Performance" },
  { message = '^docs', group = "Documentation" },
  { message = '^refactor', group = "Refactoring" },
  { message = '.*', group = "Maintenance" },
]
