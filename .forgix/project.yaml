        - sourceRef: plugins/forgix/src/cli.ts
          value: sha256:20c617177bae58819c2e0cb05a1799405d88607804962777d0aa1b3119d8d420
      value: Modules throw typed Error subclasses (e.g. ProjectProfileError, StateStoreError, StateValidationError, PolicyError, ConfigValidationError, InvocationError) carrying fixed exit codes and/or stable snake_case machine codes; cli.ts maps errors to EXIT_CODES (0 success, 2 invalid invocation, 3 invalid configuration, 4 policy contradiction, 5 state conflict, 6 blocked, 10 internal), emits JSON {command,status,data} to stdout on success (except help/init), and writes error messages to stderr. Validation, digest, privacy, receipt and atomic-write errors are blocking and never bypassed.
