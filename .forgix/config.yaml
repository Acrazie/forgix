schemaVersion: 1
worktree:
  mode: auto
merge: never
subscription:
  plan: plus
  quota:
    warningPercent: 50
    criticalPercent: 80
    unknownPolicy: conservative
integrations:
  plugins:
    - context7
  skills: []
harnesses:
  - codex
  - claude
  - antigravity
hooks:
  enforcement: strict
bootstrap:
  rules: true
  agents: false
  skills: false
  hooks: true
  gitignore: true
  worktreeInclude: true
  managedPaths:
    - .agents/rules/forgix-agent-first-plugin.md
    - .agents/rules/forgix-git-delivery-workflow.md
    - .agents/rules/forgix-golden-rules-guardrails.md
    - .claude/rules/forgix-agent-first-plugin.md
    - .claude/rules/forgix-git-delivery-workflow.md
    - .claude/rules/forgix-golden-rules-guardrails.md
    - .forgix/factory/rules/agent-first-plugin.md
    - .forgix/factory/rules/git-delivery-workflow.md
    - .forgix/factory/rules/golden-rules-guardrails.md
factoryPolicies:
  protectedSurfaces:
    - .buildkite/pipeline.yml
    - .dagger/**
    - .fallowrc.json
    - .forgix/config.yaml
    - .forgix/policy.yaml
    - .forgix/project.yaml
    - .vite-hooks/**
    - bunfig.toml
    - docs/golden-rules.md
    - fallow-baselines/**
    - fallow-rules/**
    - formal/**/*.cfg
    - formal/**/*.lean
    - formal/**/*.tla
    - test/artifact-budget.json
    - vite.config.ts
