        <title id="forgix-workflow-shape-gate-dark-title">Inside SHAPE and the GATE Barrier</title>
        <desc id="forgix-workflow-shape-gate-dark-desc">Dark state machine detailing Forgix SHAPE internal stages from Discovery through Profile Choice, repository-blind Planning, multi-host Paraphrase-First Contract Review, and the focal GATE digest barrier, with technical and product decision loops above and BUILD with factoryPolicies or Cancelled below.</desc>
