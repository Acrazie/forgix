      --color-soft: #9f949d;
      --color-rule: rgba(244, 238, 233, 0.14);
      --color-rule-solid: #756b78;
      --color-accent: #ff5e68;
      --color-accent-tint: rgba(255, 94, 104, 0.12);
      --color-link: #7da8ea;
      --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
      --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
      #forgix-workflow-shape-gate-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #forgix-workflow-shape-gate-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#forgix-workflow-shape-gate-dark-root .diagram-container { overflow-x: visible; }
}</style>
