<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="forgix-lifecycle-dark-title forgix-lifecycle-dark-desc" id="forgix-lifecycle-dark-root">
        <title id="forgix-lifecycle-dark-title">Forgix execution lifecycle</title>
        <desc id="forgix-lifecycle-dark-desc">A dark lifecycle phase map showing INTAKE, SHAPE, the focal GATE approval barrier, BUILD, and ASSURE on the primary rail, selective rework above, Halted on explicit deny, and harness runtime delegation below.</desc>
        <defs>
      <style>#forgix-lifecycle-dark-root { --color-paper:  #161318;
      --color-ink:    #f4eee9;
      --color-muted:  #c2b8bf;
      --color-accent: #ff5e68;
      --font-sans:    system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif:   Georgia, 'Times New Roman', serif;
      --font-mono:    ui-monospace, 'SFMono-Regular', Menlo, monospace; }
      #forgix-lifecycle-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #forgix-lifecycle-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #forgix-lifecycle-dark-root text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      @media print {
#forgix-lifecycle-dark-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="forgix-lifecycle-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#c2b8bf"/>
          </marker>
          <marker id="forgix-lifecycle-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#ff5e68"/>
          </marker>
          <marker id="forgix-lifecycle-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#7da8ea"/>
          </marker>
        </defs>

        <!-- Encre background -->
        <rect width="100%" height="100%" fill="#161318"/>

        <!-- Bands (drawn before arrows and nodes) -->
        <rect x="40" y="40" width="880" height="148" rx="8" fill="#211d24" fill-opacity="0.72" stroke="#f4eee9" stroke-width="1" stroke-opacity="0.14"/>
        <rect x="40" y="412" width="572" height="148" rx="8" fill="rgba(244,238,233,0.03)" stroke="#f4eee9" stroke-width="1" stroke-opacity="0.14"/>
        <rect x="636" y="412" width="280" height="148" rx="8" fill="rgba(125,168,234,0.05)" stroke="#f4eee9" stroke-width="1" stroke-opacity="0.14"/>

        <text x="56" y="60" fill="#9f949d" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.14em">WAIT / RECOVERY</text>
        <text x="56" y="232" fill="#9f949d" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
        <text x="56" y="432" fill="#9f949d" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.14em">TERMINAL OUTCOME</text>
        <text x="720" y="432" fill="#9f949d" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.14em">HARNESS ADAPTERS</text>

        <!-- Annotation callout inside Wait/Recovery band -->
        <text x="56" y="108" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">No workspace write before GATE approval</text>
        <text x="56" y="124" fill="#9f949d" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">* → Halted on user block or abort</text>

        <!-- Ten transitions, drawn before nodes -->
        <line x1="56" y1="292" x2="104" y2="292" stroke="#c2b8bf" stroke-width="1.2" marker-end="url(#forgix-lifecycle-dark-arrow)"/>
        <line x1="232" y1="292" x2="272" y2="292" stroke="#c2b8bf" stroke-width="1.2" marker-end="url(#forgix-lifecycle-dark-arrow)"/>
        <line x1="400" y1="292" x2="440" y2="292" stroke="#c2b8bf" stroke-width="1.2" marker-end="url(#forgix-lifecycle-dark-arrow)"/>
        <line x1="568" y1="292" x2="608" y2="292" stroke="#ff5e68" stroke-width="1.6" marker-end="url(#forgix-lifecycle-dark-arrow-accent)"/>
        <line x1="736" y1="292" x2="784" y2="292" stroke="#c2b8bf" stroke-width="1.2" marker-end="url(#forgix-lifecycle-dark-arrow)"/>
        <line x1="504" y1="332" x2="504" y2="448" stroke="#c2b8bf" stroke-width="1.2" marker-end="url(#forgix-lifecycle-dark-arrow)"/>
        <path d="M 816,252 V 214 Q 816,206 808,206 H 776 Q 768,206 768,198 V 156" fill="none" stroke="#c2b8bf" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#forgix-lifecycle-dark-arrow)"/>
        <line x1="672" y1="156" x2="672" y2="252" stroke="#c2b8bf" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#forgix-lifecycle-dark-arrow)"/>
        <path d="M 620,116 H 344 Q 336,116 336,124 V 252" fill="none" stroke="#c2b8bf" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#forgix-lifecycle-dark-arrow)"/>
        <line x1="684" y1="332" x2="684" y2="448" stroke="#7da8ea" stroke-width="1.2" marker-end="url(#forgix-lifecycle-dark-arrow-link)"/>

        <!-- Arrow labels (6-10px clear of stroke) -->
        <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="7" text-anchor="middle" letter-spacing="0.06em" fill="#c2b8bf">
          <text x="80" y="281">NEW</text>
          <text x="252" y="281">SCOPE</text>
          <text x="420" y="281">SPEC</text>
          <text x="588" y="281" fill="#ff5e68">ALLOW</text>
          <text x="760" y="281">VERIFY</text>
          <text x="542" y="393">REJECT</text>
          <text x="846" y="209">ISSUE</text>
          <text x="698" y="209">FIX</text>
          <text x="476" y="105">RE-PLAN</text>
          <text x="724" y="393" fill="#7da8ea">DELEGATE</text>
        </g>

        <!-- Start indicator -->
        <circle cx="48" cy="292" r="6" fill="#f4eee9"/>

        <!-- Primary rail: 5 phases -->
        <g text-anchor="middle">
          <g>
            <rect x="104" y="252" width="128" height="80" rx="8" fill="#161318"/>
            <rect x="104" y="252" width="128" height="80" rx="8" fill="#211d24" stroke="#f4eee9" stroke-width="1"/>
            <rect x="112" y="258" width="48" height="12" rx="2" fill="none" stroke="#f4eee9" stroke-width="0.8" stroke-opacity="0.35"/>
            <text x="136" y="267" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">PHASE 1</text>
            <text x="168" y="294" fill="#f4eee9" font-size="12" font-weight="600">INTAKE</text>
            <text x="168" y="312" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">scope &amp; risk</text>
          </g>

          <g>
            <rect x="272" y="252" width="128" height="80" rx="8" fill="#161318"/>
            <rect x="272" y="252" width="128" height="80" rx="8" fill="#211d24" stroke="#f4eee9" stroke-width="1"/>
            <rect x="280" y="258" width="48" height="12" rx="2" fill="none" stroke="#f4eee9" stroke-width="0.8" stroke-opacity="0.35"/>
            <text x="304" y="267" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">PHASE 2</text>
            <text x="336" y="294" fill="#f4eee9" font-size="12" font-weight="600">SHAPE</text>
            <text x="336" y="312" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">plan &amp; tests</text>
          </g>

          <g>
            <rect x="440" y="252" width="128" height="80" rx="8" fill="#161318"/>
            <rect x="440" y="252" width="128" height="80" rx="8" fill="rgba(255,94,104,0.12)" stroke="#ff5e68" stroke-width="1.5"/>
            <rect x="448" y="258" width="48" height="12" rx="2" fill="none" stroke="#ff5e68" stroke-width="0.8"/>
            <text x="472" y="267" fill="#ff5e68" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">BARRIER</text>
            <text x="504" y="294" fill="#f4eee9" font-size="12" font-weight="600">GATE</text>
            <text x="504" y="312" fill="#ff5e68" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">user approval</text>
          </g>

          <g>
            <rect x="608" y="252" width="128" height="80" rx="8" fill="#161318"/>
            <rect x="608" y="252" width="128" height="80" rx="8" fill="#211d24" stroke="#f4eee9" stroke-width="1"/>
            <rect x="616" y="258" width="48" height="12" rx="2" fill="none" stroke="#f4eee9" stroke-width="0.8" stroke-opacity="0.35"/>
            <text x="640" y="267" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">PHASE 4</text>
            <text x="672" y="294" fill="#f4eee9" font-size="12" font-weight="600">BUILD</text>
            <text x="672" y="312" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">scoped edits</text>
          </g>

          <g>
            <rect x="784" y="252" width="128" height="80" rx="8" fill="#161318"/>
            <rect x="784" y="252" width="128" height="80" rx="8" fill="#211d24" stroke="#f4eee9" stroke-width="1.2"/>
            <rect x="792" y="258" width="52" height="12" rx="2" fill="none" stroke="#f4eee9" stroke-width="0.8" stroke-opacity="0.35"/>
            <text x="818" y="267" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">COMPLETE</text>
            <circle cx="894" cy="264" r="6" fill="none" stroke="#f4eee9" stroke-width="1.2"/>
            <circle cx="894" cy="264" r="3" fill="#f4eee9"/>
            <text x="848" y="294" fill="#f4eee9" font-size="12" font-weight="600">ASSURE</text>
            <text x="848" y="312" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">checks &amp; review</text>
          </g>
        </g>

        <!-- Supporting, terminal & adapter nodes -->
        <g text-anchor="middle">
          <g>
            <rect x="620" y="76" width="200" height="80" rx="8" fill="#161318"/>
            <rect x="620" y="76" width="200" height="80" rx="8" fill="#161318" stroke="#c2b8bf" stroke-width="1" stroke-dasharray="5,4"/>
            <rect x="628" y="82" width="56" height="12" rx="2" fill="none" stroke="#756b78" stroke-width="0.8"/>
            <text x="656" y="91" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">RECOVERY</text>
            <text x="720" y="118" fill="#f4eee9" font-size="12" font-weight="600">Selective Rework</text>
            <text x="720" y="136" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">targeted loop back</text>
          </g>

          <g>
            <rect x="424" y="448" width="160" height="80" rx="8" fill="#161318"/>
            <rect x="424" y="448" width="160" height="80" rx="8" fill="rgba(244,238,233,0.04)" stroke="#c2b8bf" stroke-width="1.2" stroke-dasharray="3,3"/>
            <rect x="432" y="454" width="56" height="12" rx="2" fill="none" stroke="#756b78" stroke-width="0.8"/>
            <text x="460" y="463" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">TERMINAL</text>
            <text x="504" y="490" fill="#f4eee9" font-size="12" font-weight="600">Halted</text>
            <text x="504" y="508" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">blocked at gate</text>
          </g>

          <g>
            <rect x="656" y="448" width="240" height="80" rx="8" fill="#161318"/>
            <rect x="656" y="448" width="240" height="80" rx="8" fill="rgba(125,168,234,0.08)" stroke="#7da8ea" stroke-width="1"/>
            <rect x="664" y="454" width="52" height="12" rx="2" fill="none" stroke="#7da8ea" stroke-width="0.8"/>
            <text x="690" y="463" fill="#7da8ea" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">ADAPTER</text>
            <text x="776" y="490" fill="#f4eee9" font-size="12" font-weight="600">Harness Runtime</text>
            <text x="776" y="508" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">codex app-server · host-native</text>
          </g>
        </g>

        <!-- Concise bottom-left legend key -->
        <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#c2b8bf">
          <line x1="56" y1="476" x2="88" y2="476" stroke="#ff5e68" stroke-width="1.6"/>
          <text x="98" y="479">Explicit approval gate</text>
          <line x1="56" y1="498" x2="88" y2="498" stroke="#c2b8bf" stroke-width="1.2" stroke-dasharray="5,4"/>
          <text x="98" y="501">Selective rework transition</text>
          <line x1="56" y1="520" x2="88" y2="520" stroke="#7da8ea" stroke-width="1.2"/>
          <text x="98" y="523">Codex or host-native subagent</text>
        </g>
      </svg>
