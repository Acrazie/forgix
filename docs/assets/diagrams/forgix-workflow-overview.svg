          <text x="48" y="60">WAIT / RECOVERY</text>
          <text x="48" y="232">PRIMARY PHASES</text>
          <text x="48" y="420">TERMINAL OUTCOMES</text>
        </g>

        <g font-family="var(--font-mono)" fill="#504856">
          <text x="48" y="104" font-size="9">Any phase → blocked (persists exact resumeTo + resumeReason)</text>
          <text x="48" y="124" font-size="8" fill="#635a6a">No workspace write before GATE digest approval · GATE change / BUILD drift re-enter SHAPE</text>
          <text x="48" y="456" font-size="9">Delivery (Git, PR, release) &amp; $forgix retro run outside TaskState</text>
          <text x="48" y="476" font-size="8" fill="#635a6a">Factory setup ($forgix init → .forgix/factory/) &amp; $forgix roadmap also outside</text>
          <text x="48" y="494" font-size="8" fill="#635a6a">ASSURE ✓ is final; retro-factory emits advisory hints for human-confirmed diffs</text>
        </g>

