<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="forgix-workflow-overview-title forgix-workflow-overview-desc" id="forgix-workflow-overview-root">
        <title id="forgix-workflow-overview-title">Forgix Execution Workflow</title>
        <desc id="forgix-workflow-overview-desc">Lifecycle phase map of Forgix TaskState V6 showing INTAKE, SHAPE, the focal GATE approval barrier, BUILD with factoryPolicies, and terminal ASSURE with advisory retro hints, selective rework above, and Cancelled and Failed outcomes plus outside-TaskState setup and retro notes below.</desc>
        <defs>
      <style>#forgix-workflow-overview-root { --color-paper: #f4eee9;
      --color-paper-2: #ebe2da;
      --color-ink: #161318;
      --color-muted: #504856;
      --color-soft: #635a6a;
      --color-rule: rgba(22, 19, 24, 0.12);
      --color-rule-solid: #857982;
      --color-accent: #ae123d;
      --color-accent-tint: rgba(174, 18, 61, 0.08);
      --color-link: #2b5292;
      --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
      --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
      #forgix-workflow-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #forgix-workflow-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#forgix-workflow-overview-root .diagram-container { overflow-x: visible; }
}</style>
