<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="forgix-roadmap-title forgix-roadmap-desc" id="forgix-roadmap-root">
        <title id="forgix-roadmap-title">Forgix roadmap ideation and execution architecture</title>
        <desc id="forgix-roadmap-desc">Architecture diagram showing upstream $forgix roadmap ideation in three phases gated before publishing Feature parents and Work Item sub-issues to GitHub Project v2, followed by isolated main-branch worktree execution via run-issue and run-roadmap.</desc>
        <defs>
      <style>#forgix-roadmap-root { --color-paper:  #f4eee9;
      --color-ink:    #161318;
      --color-muted:  #504856;
      --color-accent: #ae123d;
      --font-sans:    system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif:   Georgia, 'Times New Roman', serif;
      --font-mono:    ui-monospace, 'SFMono-Regular', Menlo, monospace; }
      #forgix-roadmap-root { font-family: var(--font-sans); color: var(--color-ink); }
      #forgix-roadmap-root .diagram-container { width: 100%; overflow-x: auto; }
      #forgix-roadmap-root text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      @media print {
#forgix-roadmap-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="forgix-roadmap-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#504856"/>
          </marker>
          <marker id="forgix-roadmap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#ae123d"/>
          </marker>
          <marker id="forgix-roadmap-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2b5292"/>
          </marker>
        </defs>

        <!-- Paper background -->
        <rect width="100%" height="100%" fill="#f4eee9"/>

        <!-- Three stage zones (drawn before arrows and nodes) -->
        <rect x="40" y="40" width="232" height="520" rx="8" fill="#ebe2da" fill-opacity="0.45" stroke="#161318" stroke-width="1" stroke-opacity="0.12"/>
        <rect x="56" y="44" width="136" height="12" rx="2" fill="#f4eee9"/>
        <text x="124" y="53" fill="#635a6a" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">1 · IDEATION SESSION</text>

        <rect x="364" y="40" width="232" height="520" rx="8" fill="rgba(22,19,24,0.02)" stroke="#161318" stroke-width="1" stroke-opacity="0.12"/>
        <rect x="380" y="44" width="136" height="12" rx="2" fill="#f4eee9"/>
        <text x="448" y="53" fill="#635a6a" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">2 · GITHUB PROJECT v2</text>

        <rect x="688" y="40" width="232" height="520" rx="8" fill="rgba(43,82,146,0.03)" stroke="#161318" stroke-width="1" stroke-opacity="0.12"/>
        <rect x="704" y="44" width="144" height="12" rx="2" fill="#f4eee9"/>
        <text x="776" y="53" fill="#635a6a" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">3 · AUTONOMOUS RUNNER</text>

        <!-- Seven connectors, drawn before nodes -->
        <!-- 1. Preflight & Diverge -> Converge Backlog -->
        <line x1="156" y1="164" x2="156" y2="228" stroke="#504856" stroke-width="1.2" marker-end="url(#forgix-roadmap-arrow)"/>
        <!-- 2. Converge Backlog -> Approval Gate -->
        <line x1="156" y1="308" x2="156" y2="372" stroke="#504856" stroke-width="1.2" marker-end="url(#forgix-roadmap-arrow)"/>
        <!-- 3. Approval Gate -> Feature Parents (focal accent) -->
        <path d="M 256,412 H 292 Q 300,412 300,404 V 196 Q 300,188 308,188 H 380" fill="none" stroke="#ae123d" stroke-width="1.6" marker-end="url(#forgix-roadmap-arrow-accent)"/>
        <!-- 4. Feature Parents -> Work Item Sub-Issues -->
        <line x1="480" y1="228" x2="480" y2="292" stroke="#504856" stroke-width="1.2" marker-end="url(#forgix-roadmap-arrow)"/>
        <!-- 5. Work Item Sub-Issues -> Ready Queue (GitHub -> local runner bridge) -->
        <path d="M 580,332 H 616 Q 624,332 624,324 V 132 Q 624,124 632,124 H 704" fill="none" stroke="#2b5292" stroke-width="1.2" marker-end="url(#forgix-roadmap-arrow-link)"/>
        <!-- 6. Ready Queue -> Isolated Worktree -->
        <line x1="804" y1="164" x2="804" y2="228" stroke="#504856" stroke-width="1.2" marker-end="url(#forgix-roadmap-arrow)"/>
        <!-- 7. Isolated Worktree -> Risk-Tiered Runner -->
        <line x1="804" y1="308" x2="804" y2="372" stroke="#504856" stroke-width="1.2" marker-end="url(#forgix-roadmap-arrow)"/>

        <!-- Arrow labels (6-10px clear of stroke, sitting in open space) -->
        <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="7" letter-spacing="0.06em" fill="#504856">
          <text x="166" y="199" text-anchor="start">THEMES</text>
          <text x="166" y="343" text-anchor="start">VALIDATE</text>
          <text x="310" y="303" text-anchor="start" fill="#ae123d">PUBLISH</text>
          <text x="490" y="263" text-anchor="start">SUB-ISSUES</text>
          <text x="634" y="231" text-anchor="start" fill="#2b5292">UNBLOCKED</text>
          <text x="814" y="199" text-anchor="start">BRANCH</text>
          <text x="814" y="343" text-anchor="start">LIFECYCLE</text>
        </g>

        <!-- Zone 1 nodes: Upstream Ideation Session -->
        <g text-anchor="middle">
          <g>
            <rect x="56" y="84" width="200" height="80" rx="8" fill="#f4eee9"/>
            <rect x="56" y="84" width="200" height="80" rx="8" fill="#ffffff" stroke="#161318" stroke-width="1"/>
            <rect x="64" y="90" width="48" height="12" rx="2" fill="none" stroke="#161318" stroke-width="0.8" stroke-opacity="0.28"/>
            <text x="88" y="99" fill="#504856" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">PHASE 1</text>
            <text x="156" y="126" fill="#161318" font-size="12" font-weight="600">Preflight &amp; Diverge</text>
            <text x="156" y="144" fill="#504856" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">themes · risks · gh scope</text>
          </g>

          <g>
            <rect x="56" y="228" width="200" height="80" rx="8" fill="#f4eee9"/>
            <rect x="56" y="228" width="200" height="80" rx="8" fill="#ffffff" stroke="#161318" stroke-width="1"/>
            <rect x="64" y="234" width="48" height="12" rx="2" fill="none" stroke="#161318" stroke-width="0.8" stroke-opacity="0.28"/>
            <text x="88" y="243" fill="#504856" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">PHASE 2</text>
            <text x="156" y="270" fill="#161318" font-size="12" font-weight="600">Converge Backlog</text>
            <text x="156" y="288" fill="#504856" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">Feature → Work Item DAG</text>
          </g>

          <!-- Focal accent node: Approval Gate before GitHub mutation -->
          <g>
            <rect x="56" y="372" width="200" height="80" rx="8" fill="#f4eee9"/>
            <rect x="56" y="372" width="200" height="80" rx="8" fill="rgba(174,18,61,0.08)" stroke="#ae123d" stroke-width="1.5"/>
            <rect x="64" y="378" width="48" height="12" rx="2" fill="none" stroke="#ae123d" stroke-width="0.8"/>
            <text x="88" y="387" fill="#ae123d" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">BARRIER</text>
            <text x="156" y="414" fill="#161318" font-size="12" font-weight="600">Approval Gate</text>
            <text x="156" y="432" fill="#ae123d" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">validate &amp; DAG preview</text>
          </g>
        </g>

        <!-- Zone 2 nodes: Published GitHub Project v2 -->
        <g text-anchor="middle">
          <g>
            <rect x="380" y="148" width="200" height="80" rx="8" fill="#f4eee9"/>
            <rect x="380" y="148" width="200" height="80" rx="8" fill="#ffffff" stroke="#161318" stroke-width="1"/>
            <rect x="388" y="154" width="52" height="12" rx="2" fill="none" stroke="#161318" stroke-width="0.8" stroke-opacity="0.28"/>
            <text x="414" y="163" fill="#504856" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">PROJECT</text>
            <text x="480" y="190" fill="#161318" font-size="12" font-weight="600">Feature Parents</text>
            <text x="480" y="208" fill="#504856" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">capability outcome</text>
          </g>

          <g>
            <rect x="380" y="292" width="200" height="80" rx="8" fill="#f4eee9"/>
            <rect x="380" y="292" width="200" height="80" rx="8" fill="#ffffff" stroke="#161318" stroke-width="1"/>
            <rect x="388" y="298" width="60" height="12" rx="2" fill="none" stroke="#161318" stroke-width="0.8" stroke-opacity="0.28"/>
            <text x="418" y="307" fill="#504856" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">WORK ITEM</text>
            <text x="480" y="334" fill="#161318" font-size="12" font-weight="600">Work Item Sub-Issues</text>
            <text x="480" y="352" fill="#504856" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">P0–P3 · blockedBy · Wave</text>
          </g>
        </g>

        <!-- Zone 3 nodes: Autonomous Runner (run-issue / run-roadmap) -->
        <g text-anchor="middle">
          <g>
            <rect x="704" y="84" width="200" height="80" rx="8" fill="#f4eee9"/>
            <rect x="704" y="84" width="200" height="80" rx="8" fill="rgba(43,82,146,0.06)" stroke="#2b5292" stroke-width="1"/>
            <rect x="712" y="90" width="48" height="12" rx="2" fill="none" stroke="#2b5292" stroke-width="0.8"/>
            <text x="736" y="99" fill="#2b5292" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">SELECT</text>
            <text x="804" y="126" fill="#161318" font-size="12" font-weight="600">Ready Queue</text>
            <text x="804" y="144" fill="#504856" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">select-ready (deps Done)</text>
          </g>

          <g>
            <rect x="704" y="228" width="200" height="80" rx="8" fill="#f4eee9"/>
            <rect x="704" y="228" width="200" height="80" rx="8" fill="#ffffff" stroke="#161318" stroke-width="1"/>
            <rect x="712" y="234" width="56" height="12" rx="2" fill="none" stroke="#161318" stroke-width="0.8" stroke-opacity="0.28"/>
            <text x="740" y="243" fill="#504856" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">WORKTREE</text>
            <text x="804" y="270" fill="#161318" font-size="12" font-weight="600">Isolated Worktree</text>
            <text x="804" y="288" fill="#504856" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">fresh main branch / item</text>
          </g>

          <g>
            <rect x="704" y="372" width="200" height="80" rx="8" fill="#f4eee9"/>
            <rect x="704" y="372" width="200" height="80" rx="8" fill="#ffffff" stroke="#161318" stroke-width="1.2"/>
            <rect x="712" y="378" width="48" height="12" rx="2" fill="none" stroke="#161318" stroke-width="0.8" stroke-opacity="0.28"/>
            <text x="736" y="387" fill="#504856" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">RUNNER</text>
            <text x="804" y="414" fill="#161318" font-size="12" font-weight="600">Risk-Tiered Runner</text>
            <text x="804" y="432" fill="#504856" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">lifecycle → Draft PR</text>
          </g>
        </g>

        <!-- Concise bottom notes inside each zone -->
        <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#504856">
          <text x="56" y="492">Runs outside TaskState</text>
          <text x="56" y="510" fill="#635a6a">.codex/roadmap/state.yaml</text>
          <text x="56" y="528" fill="#635a6a">resumable session checkpoint</text>

          <text x="380" y="424">Wave 1 unblocked → Ready</text>
          <text x="380" y="442" fill="#635a6a">Wave 2+ or blocked → Backlog</text>
          <text x="380" y="460" fill="#635a6a">native blocked-by DAG edges</text>

          <text x="704" y="492">$forgix run-issue / run-roadmap</text>
          <text x="704" y="510" fill="#635a6a">low/med → auto Gate receipt</text>
          <text x="704" y="528" fill="#635a6a">high/crit → human Gate pause</text>
        </g>
      </svg>
