      --color-soft: #635a6a;
      --color-rule: rgba(22, 19, 24, 0.12);
      --color-rule-solid: #857982;
      --color-accent: #ae123d;
      --color-accent-tint: rgba(174, 18, 61, 0.08);
      --color-link: #2b5292;
      --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
      --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
      #forgix-workflow-shape-gate-root { font-family: var(--font-sans); color: var(--color-ink); }
      #forgix-workflow-shape-gate-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#forgix-workflow-shape-gate-root .diagram-container { overflow-x: visible; }
}</style>
