          <g>
            <rect x="296" y="76" width="240" height="80" rx="8" fill="#161318"/>
            <rect x="296" y="76" width="240" height="80" rx="8" fill="#211d24" stroke="#f4eee9" stroke-width="1"/>
            <rect x="304" y="82" width="52" height="12" rx="2" fill="none" stroke="#f4eee9" stroke-width="0.8" stroke-opacity="0.35"/>
            <text x="330" y="91" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">TRACKED</text>
            <text x="416" y="118" fill="#f4eee9" font-size="12" font-weight="600">Project Profile</text>
            <text x="416" y="136" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">project.yaml &amp; diagrams/</text>
          </g>

          <g>
            <rect x="296" y="176" width="240" height="80" rx="8" fill="#161318"/>
            <rect x="296" y="176" width="240" height="80" rx="8" fill="#211d24" stroke="#f4eee9" stroke-width="1"/>
            <rect x="304" y="182" width="52" height="12" rx="2" fill="none" stroke="#f4eee9" stroke-width="0.8" stroke-opacity="0.35"/>
            <text x="330" y="191" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">TRACKED</text>
            <text x="416" y="218" fill="#f4eee9" font-size="12" font-weight="600">Repo Config</text>
            <text x="416" y="236" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">.codex/forgix.yaml</text>
          </g>
        </g>

        <!-- Zone 2 nodes: Local · Gitignored -->
        <g text-anchor="middle">
          <g>
            <rect x="68" y="344" width="180" height="80" rx="8" fill="#161318"/>
            <rect x="68" y="344" width="180" height="80" rx="8" fill="#161318" stroke="#c2b8bf" stroke-width="1" stroke-dasharray="5,4"/>
            <rect x="76" y="350" width="48" height="12" rx="2" fill="none" stroke="#756b78" stroke-width="0.8"/>
            <text x="100" y="359" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">RESUME</text>
            <text x="158" y="386" fill="#f4eee9" font-size="12" font-weight="600">INIT State</text>
            <text x="158" y="404" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">.codex/project-init/</text>
          </g>

          <g>
            <rect x="296" y="344" width="240" height="80" rx="8" fill="#161318"/>
            <rect x="296" y="344" width="240" height="80" rx="8" fill="#211d24" stroke="#c2b8bf" stroke-width="1" stroke-dasharray="5,4"/>
            <rect x="304" y="350" width="64" height="12" rx="2" fill="none" stroke="#756b78" stroke-width="0.8"/>
            <text x="336" y="359" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">GITIGNORED</text>
            <text x="416" y="386" fill="#f4eee9" font-size="12" font-weight="600">Local Overlays</text>
            <text x="416" y="404" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">.codex/*.local.yaml</text>
          </g>

          <g>
            <rect x="296" y="456" width="240" height="80" rx="8" fill="#161318"/>
            <rect x="296" y="456" width="240" height="80" rx="8" fill="#211d24" stroke="#c2b8bf" stroke-width="1" stroke-dasharray="5,4"/>
            <rect x="304" y="462" width="48" height="12" rx="2" fill="none" stroke="#756b78" stroke-width="0.8"/>
            <text x="328" y="471" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">GLOBAL</text>
            <text x="416" y="498" fill="#f4eee9" font-size="12" font-weight="600">User Defaults</text>
            <text x="416" y="516" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">~/.codex/forgix.yaml</text>
          </g>
        </g>

        <!-- Runtime resolution rail -->
        <g text-anchor="middle">
          <g>
            <rect x="660" y="76" width="240" height="80" rx="8" fill="#161318"/>
            <rect x="660" y="76" width="240" height="80" rx="8" fill="#211d24" stroke="#f4eee9" stroke-width="1.2"/>
            <rect x="668" y="82" width="52" height="12" rx="2" fill="none" stroke="#f4eee9" stroke-width="0.8" stroke-opacity="0.35"/>
            <text x="694" y="91" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">HARNESS</text>
            <text x="780" y="118" fill="#f4eee9" font-size="12" font-weight="600">Effective Runtime</text>
            <text x="780" y="136" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">policy + project context</text>
          </g>

          <g>
            <rect x="660" y="276" width="240" height="112" rx="8" fill="#161318"/>
            <rect x="660" y="276" width="240" height="112" rx="8" fill="#211d24" stroke="#f4eee9" stroke-width="1"/>
            <rect x="668" y="282" width="64" height="12" rx="2" fill="none" stroke="#f4eee9" stroke-width="0.8" stroke-opacity="0.35"/>
            <text x="700" y="291" fill="#c2b8bf" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">PRECEDENCE</text>
            <text x="780" y="330" fill="#f4eee9" font-size="12" font-weight="600">Config &amp; CLI Merge</text>
            <text x="780" y="350" fill="#c2b8bf" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">1·defaults &lt; ... &lt; 5·flags</text>
          </g>

          <!-- Focal accent node: Repository Policy -->
          <g>
            <rect x="660" y="448" width="240" height="80" rx="8" fill="#161318"/>
            <rect x="660" y="448" width="240" height="80" rx="8" fill="rgba(255,94,104,0.12)" stroke="#ff5e68" stroke-width="1.5"/>
            <rect x="668" y="454" width="52" height="12" rx="2" fill="none" stroke="#ff5e68" stroke-width="0.8"/>
            <text x="694" y="463" fill="#ff5e68" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">CEILING</text>
            <text x="780" y="490" fill="#f4eee9" font-size="12" font-weight="600">Repository Policy</text>
            <text x="780" y="508" fill="#ff5e68" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">cannot be weakened</text>
          </g>
        </g>

        <!-- Clean legend key in bottom-left -->
        <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#c2b8bf">
          <rect x="68" y="472" width="14" height="10" rx="2" fill="#211d24" stroke="#f4eee9" stroke-width="1"/>
          <text x="90" y="480">Tracked repository artifacts</text>
          <rect x="68" y="494" width="14" height="10" rx="2" fill="#211d24" stroke="#c2b8bf" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="90" y="502">Local or global overrides</text>
          <line x1="68" y1="521" x2="84" y2="521" stroke="#ff5e68" stroke-width="1.6"/>
          <text x="90" y="524">Non-weakenable policy cap</text>
        </g>
      </svg>
