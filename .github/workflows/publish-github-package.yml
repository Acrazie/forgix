name: Publish GitHub package mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versions:
        description: Stable npm version, release tag, or all stable versions
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: publish-github-package
  queue: max

jobs:
  mirror:
    name: Mirror npm package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'v') ||
      startsWith(github.event.release.tag_name, 'npm-v') ||
      startsWith(github.event.release.tag_name, 'forgix-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@acrazie"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Mirror canonical npm package
        env:
          MIRROR_SELECTOR: ${{ github.event.inputs.versions || github.event.release.tag_name }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/mirror-npm-to-github.ts "$MIRROR_SELECTOR"
