name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  website:
    name: Website (Node 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run site:build

  quality-gate:
    name: Full Gate (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Observe Fast Gate
        run: bun scripts/observe-command.ts "Fast Gate" bun run check:staged
      - name: Run Full Gate
        run: bun scripts/observe-command.ts "Full Gate" bun run check
      - name: Build shared runtime artifact
        run: bun run pack:runtime
      - uses: actions/upload-artifact@v4
        with:
          name: dev-flow-runtime
          path: .artifacts/dev-flow.tgz
          if-no-files-found: error

  runtime-smoke:
    name: Runtime Smoke (${{ matrix.os }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dev-flow-runtime
          path: .artifacts
      - name: Run packed runtime smoke
        run: node --test plugins/codex-dev-flow/test/runtime/runtime-smoke.test.mjs

  maintainer-release-macos:
    name: Maintainer Release (macOS)
    needs: quality-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd plugins/codex-dev-flow release:test

  full-gate:
    name: Full Gate
    if: always()
    needs: [quality-gate, runtime-smoke, maintainer-release-macos, website]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported lane
        env:
          QUALITY_RESULT: ${{ needs.quality-gate.result }}
          RELEASE_RESULT: ${{ needs.maintainer-release-macos.result }}
          RUNTIME_RESULT: ${{ needs.runtime-smoke.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RELEASE_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$WEBSITE_RESULT" = success
