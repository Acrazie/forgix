name: CI

on:
  workflow_call:
    inputs:
      release-tag:
        required: false
        default: ""
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: Full Gate (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install pinned git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.1
          args: --strip all
        env:
          OUTPUT: ${{ runner.temp }}/git-cliff-bootstrap.md
      - name: Expose git-cliff to release contract tests
        run: echo "$RUNNER_TEMP/git-cliff/bin" >> "$GITHUB_PATH"
      - name: Run Full Gate
        run: bun scripts/observe-command.ts "Full Gate" bun run check
      - name: Require committed deterministic bundle
        if: inputs.release-tag != ''
        run: git diff --exit-code -- dist/forgix.mjs
      - name: Pin npm pack to the publisher toolchain
        if: inputs.release-tag != ''
        run: npm install --global npm@11.21.1 --ignore-scripts
      - name: Prepare immutable release candidate
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          export PATH="$RUNNER_TEMP/git-cliff/bin:$PATH"
          node scripts/release-ci.ts candidate
      - name: Build shared runtime artifact
        if: inputs.release-tag == '' || startsWith(inputs.release-tag, 'plugin-v')
        run: bun run pack:runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forgix-runtime
          # .artifacts is hidden; allow only these audited release files.
          path: |
            .artifacts/forgix.tgz
            .artifacts/RELEASE_NOTES.md
            .artifacts/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  runtime-smoke:
    name: Runtime Smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: forgix-runtime
          path: .artifacts
      - name: Run packed runtime smoke
        run: node --test test/runtime/runtime-smoke.test.mjs

  maintainer-release-macos:
    name: Maintainer Release (macOS)
    needs: quality-gate
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install pinned git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.1
          args: --strip all
        env:
          OUTPUT: ${{ runner.temp }}/git-cliff-bootstrap.md
      - name: Expose git-cliff to release contract tests
        run: echo "$RUNNER_TEMP/git-cliff/bin" >> "$GITHUB_PATH"
      - run: bun run release:test

  full-gate:
    name: Full Gate
    if: always()
    needs: [quality-gate, runtime-smoke, maintainer-release-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every supported lane
        env:
          QUALITY_RESULT: ${{ needs.quality-gate.result }}
          RELEASE_RESULT: ${{ needs.maintainer-release-macos.result }}
          RUNTIME_RESULT: ${{ needs.runtime-smoke.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RELEASE_RESULT" = success
          test "$RUNTIME_RESULT" = success
