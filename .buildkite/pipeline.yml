# Buildkite pipeline for /et/forgix/forgix (Entire-native repository).
# Orchestrates CI/CD execution via the Dagger module in .dagger/.

env:
  DAGGER_VERSION: "0.21.11"
  RENOVATE_VERSION: "44.247.1"

steps:
  - key: renovate-sync
    label: ":renovate: Weekly Dependency Sync"
    if: build.source == "schedule"
    concurrency: 1
    concurrency_group: forgix-renovate
    timeout_in_minutes: 20
    env:
      GIT_AUTHOR_NAME: "renovate[bot]"
      GIT_AUTHOR_EMAIL: "renovate[bot]@users.noreply.entire.io"
      GIT_COMMITTER_NAME: "renovate[bot]"
      GIT_COMMITTER_EMAIL: "renovate[bot]@users.noreply.entire.io"
    commands:
      - git fetch origin
      - |
        export PATH="$${HOME}/.bun/bin:$${PATH}"
        expected_bun="$$(tr -d '[:space:]' < .bun-version)"
        if ! command -v bun >/dev/null 2>&1 || [ "$$(bun --version)" != "$${expected_bun}" ]; then
          curl -fsSL https://bun.sh/install | bash -s "bun-v$${expected_bun}"
        fi
        report_path="$$(mktemp /tmp/renovate-report-XXXXXX.json)"
        trap 'rm -f "$${report_path}"' EXIT
        bunx renovate@"$${RENOVATE_VERSION}" --platform=local --report-type=file --report-path="$${report_path}"
        bun scripts/renovate-sync.ts --report-path "$${report_path}"

  - key: quality-gate
    label: ":dagger: Full Gate"
    if: build.source != "schedule"
    timeout_in_minutes: 15
    artifact_paths:
      - ".fallow/dead-code.json"
      - ".artifacts/forgix.tgz"
      - ".artifacts/RELEASE_NOTES.md"
      - ".artifacts/release.json"
    commands:
      - |
        export PATH="$${HOME}/.local/bin:$${PATH}"
        if ! command -v dagger >/dev/null 2>&1 || [ "$$(dagger version | awk '{print $$2}')" != "v$${DAGGER_VERSION}" ]; then
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="$${DAGGER_VERSION}" BIN_DIR="$${HOME}/.local/bin" sh
        fi
        dagger call dead-code-report --source=. --output=.fallow/dead-code.json &&
          dagger call check --source=.
      - |
        export PATH="$${HOME}/.local/bin:$${PATH}"
        if [ -z "$${BUILDKITE_TAG:-}" ]; then
          if [ -f "$$(git rev-parse --git-dir)/shallow" ]; then git fetch --unshallow; fi
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          dagger call diff-gate --source=.
        fi
      - |
        export PATH="$${HOME}/.local/bin:$${PATH}"
        if [ -n "$${BUILDKITE_TAG:-}" ]; then
          if [ -f "$$(git rev-parse --git-dir)/shallow" ]; then git fetch --unshallow; fi
          git fetch --tags origin "+refs/heads/main:refs/remotes/origin/main"
          dagger call release-candidate \
            --source=. \
            --tag="$${BUILDKITE_TAG}" \
            --buildkite="$${BUILDKITE}" \
            --buildkite-repo="$${BUILDKITE_REPO}" \
            --buildkite-commit="$${BUILDKITE_COMMIT}" \
            --buildkite-pull-request="$${BUILDKITE_PULL_REQUEST:-}" \
            --cache-buster="$${BUILDKITE_BUILD_ID}-$${BUILDKITE_RETRY_COUNT:-0}" \
            --output=.artifacts
        fi
      - |
        export PATH="$${HOME}/.local/bin:$${PATH}"
        if [ -z "$${BUILDKITE_TAG:-}" ]; then
          dagger call pack-runtime --source=. --output=.artifacts/forgix.tgz
        fi

  - key: formal-lean
    label: ":dagger: Lean Workflow Pilots"
    if: 'build.source != "schedule" && build.tag == null && build.branch !~ /^release\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/ && build.message !~ /^chore\(release\): v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(\n|$)/'
    soft_fail: true
    timeout_in_minutes: 15
    commands:
      - |
        export PATH="$${HOME}/.local/bin:$${PATH}"
        if ! command -v dagger >/dev/null 2>&1 || [ "$$(dagger version | awk '{print $$2}')" != "v$${DAGGER_VERSION}" ]; then
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="$${DAGGER_VERSION}" BIN_DIR="$${HOME}/.local/bin" sh
        fi
        dagger call formal-lean --source=.

  - key: formal-tla
    label: ":dagger: TLA+ Model Checks"
    if: 'build.source != "schedule" && build.tag == null && build.branch !~ /^release\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/ && build.message !~ /^chore\(release\): v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(\n|$)/'
    soft_fail: true
    timeout_in_minutes: 5
    commands:
      - |
        timeout --verbose --kill-after=10s 4m bash -e -o pipefail -c '
          export PATH="$${HOME}/.local/bin:$${PATH}"
          if ! command -v dagger >/dev/null 2>&1 || [ "$$(dagger version | awk "{print \$$2}")" != "v$${DAGGER_VERSION}" ]; then
            curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="$${DAGGER_VERSION}" BIN_DIR="$${HOME}/.local/bin" sh
          fi
          exec dagger call formal-tla --source=.
        '

  - key: runtime-smoke
    label: ":node: Runtime Smoke (Node 26)"
    if: build.source != "schedule"
    depends_on:
      - quality-gate
    timeout_in_minutes: 10
    commands:
      - |
        export PATH="$${HOME}/.local/bin:$${PATH}"
        if ! command -v dagger >/dev/null 2>&1 || [ "$$(dagger version | awk '{print $$2}')" != "v$${DAGGER_VERSION}" ]; then
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="$${DAGGER_VERSION}" BIN_DIR="$${HOME}/.local/bin" sh
        fi
        case "$${BUILDKITE_TAG:-}" in
          v*) bash scripts/release-smoke.sh ;;
          *)
            buildkite-agent artifact download ".artifacts/forgix.tgz" . &&
              dagger call runtime-smoke --source=. --tarball=.artifacts/forgix.tgz
            ;;
        esac

  - key: release-contract
    label: ":package: Release Contract Tests"
    if: build.source != "schedule"
    timeout_in_minutes: 15
    commands:
      - |
        export PATH="$${HOME}/.local/bin:$${PATH}"
        if ! command -v dagger >/dev/null 2>&1 || [ "$$(dagger version | awk '{print $$2}')" != "v$${DAGGER_VERSION}" ]; then
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="$${DAGGER_VERSION}" BIN_DIR="$${HOME}/.local/bin" sh
        fi
        dagger call release-contract --source=.

  - key: release-main
    label: ":rocket: Release Tag & Prepare"
    if: build.branch == "main" && build.source != "schedule" && build.tag == null && build.pull_request.id == null
    depends_on:
      - quality-gate
      - runtime-smoke
      - release-contract
    concurrency: 1
    concurrency_group: forgix-release-lifecycle
    timeout_in_minutes: 15
    env:
      GIT_AUTHOR_NAME: "forgix-release[bot]"
      GIT_AUTHOR_EMAIL: "forgix-release[bot]@users.noreply.entire.io"
      GIT_COMMITTER_NAME: "forgix-release[bot]"
      GIT_COMMITTER_EMAIL: "forgix-release[bot]@users.noreply.entire.io"
    commands:
      - |
        set -euo pipefail
        export PATH="$${HOME}/.local/bin:$${HOME}/.bun/bin:$${PATH}"
        if ! command -v entire >/dev/null 2>&1; then
          curl -fsSL https://entire.io/install.sh | bash
        fi
        expected_bun="$$(tr -d '[:space:]' < .bun-version)"
        if ! command -v bun >/dev/null 2>&1 || [ "$$(bun --version)" != "$${expected_bun}" ]; then
          curl -fsSL https://bun.sh/install | bash -s "bun-v$${expected_bun}"
        fi
        if ! command -v dagger >/dev/null 2>&1 || [ "$$(dagger version | awk '{print $$2}')" != "v$${DAGGER_VERSION}" ]; then
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="$${DAGGER_VERSION}" BIN_DIR="$${HOME}/.local/bin" sh
        fi
        ENTIRE_AUTH_URL="https://eu.auth.entire.io"
        OIDC_TOKEN="$$(buildkite-agent oidc request-token --audience "$${ENTIRE_AUTH_URL}/api/authz/sts")"
        [ -n "$${OIDC_TOKEN}" ] || { echo "Empty Buildkite OIDC token" >&2; exit 1; }
        TOKEN_HTTP="$$(curl -sS -w '\n%{http_code}' -X POST "$${ENTIRE_AUTH_URL}/oauth/token" -u entire-cli: \
          --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
          --data-urlencode subject_token_type=urn:ietf:params:oauth:token-type:jwt \
          --data-urlencode "subject_token=$${OIDC_TOKEN}" \
          --data-urlencode "audience=$${ENTIRE_AUTH_URL}" \
          --data-urlencode resource=svc_01M8CHF4WWEXY2Z6R92SBEJSNC)"
        ENTIRE_TOKEN="$$(printf '%s' "$${TOKEN_HTTP}" | bun -e '
          const raw = await Bun.stdin.text();
          const cut = raw.lastIndexOf("\n");
          const status = Number(raw.slice(cut + 1).trim());
          const body = JSON.parse(raw.slice(0, cut));
          if (status < 200 || status >= 300 || typeof body.access_token !== "string" || !body.access_token) {
            console.error(body.error_description || body.error || `HTTP ${status}`);
            process.exit(1);
          }
          process.stdout.write(body.access_token);
        ')"
        [ -n "$${ENTIRE_TOKEN}" ] || { echo "Empty Entire access token" >&2; exit 1; }
        export ENTIRE_TOKEN
        if [ -f "$$(git rev-parse --git-dir)/shallow" ]; then git fetch --unshallow; fi
        git fetch --tags origin "+refs/heads/main:refs/remotes/origin/main"
        FORGIX_PREPARE_FILES_MODE="dagger"
        export FORGIX_PREPARE_FILES_MODE
        bun run release:auto main

  - key: release-merge
    label: ":merge: Auto-Merge Release Trail"
    if: build.branch =~ /^release\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/ && build.source != "schedule" && build.tag == null
    depends_on:
      - quality-gate
      - runtime-smoke
      - release-contract
    concurrency: 1
    concurrency_group: forgix-release-lifecycle
    timeout_in_minutes: 10
    commands:
      - |
        set -euo pipefail
        export PATH="$${HOME}/.local/bin:$${HOME}/.bun/bin:$${PATH}"
        if ! command -v entire >/dev/null 2>&1; then
          curl -fsSL https://entire.io/install.sh | bash
        fi
        expected_bun="$$(tr -d '[:space:]' < .bun-version)"
        if ! command -v bun >/dev/null 2>&1 || [ "$$(bun --version)" != "$${expected_bun}" ]; then
          curl -fsSL https://bun.sh/install | bash -s "bun-v$${expected_bun}"
        fi
        ENTIRE_AUTH_URL="https://eu.auth.entire.io"
        OIDC_TOKEN="$$(buildkite-agent oidc request-token --audience "$${ENTIRE_AUTH_URL}/api/authz/sts")"
        [ -n "$${OIDC_TOKEN}" ] || { echo "Empty Buildkite OIDC token" >&2; exit 1; }
        TOKEN_HTTP="$$(curl -sS -w '\n%{http_code}' -X POST "$${ENTIRE_AUTH_URL}/oauth/token" -u entire-cli: \
          --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
          --data-urlencode subject_token_type=urn:ietf:params:oauth:token-type:jwt \
          --data-urlencode "subject_token=$${OIDC_TOKEN}" \
          --data-urlencode "audience=$${ENTIRE_AUTH_URL}" \
          --data-urlencode resource=svc_01M8CHF4WWEXY2Z6R92SBEJSNC)"
        ENTIRE_TOKEN="$$(printf '%s' "$${TOKEN_HTTP}" | bun -e '
          const raw = await Bun.stdin.text();
          const cut = raw.lastIndexOf("\n");
          const status = Number(raw.slice(cut + 1).trim());
          const body = JSON.parse(raw.slice(0, cut));
          if (status < 200 || status >= 300 || typeof body.access_token !== "string" || !body.access_token) {
            console.error(body.error_description || body.error || `HTTP ${status}`);
            process.exit(1);
          }
          process.stdout.write(body.access_token);
        ')"
        [ -n "$${ENTIRE_TOKEN}" ] || { echo "Empty Entire access token" >&2; exit 1; }
        export ENTIRE_TOKEN
        if [ -f "$$(git rev-parse --git-dir)/shallow" ]; then git fetch --unshallow; fi
        git fetch --tags origin "+refs/heads/main:refs/remotes/origin/main"
        bun run release:auto merge

  - key: release-mirror
    label: ":github: Sync Release to GitHub Mirror"
    if: build.tag =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/ && build.source != "schedule"
    depends_on:
      - quality-gate
      - runtime-smoke
    concurrency: 1
    concurrency_group: forgix-release-mirror
    timeout_in_minutes: 10
    env:
      GIT_AUTHOR_NAME: "forgix-release[bot]"
      GIT_AUTHOR_EMAIL: "forgix-release[bot]@users.noreply.entire.io"
      GIT_COMMITTER_NAME: "forgix-release[bot]"
      GIT_COMMITTER_EMAIL: "forgix-release[bot]@users.noreply.entire.io"
    commands:
      - |
        set -euo pipefail
        export PATH="$${HOME}/.local/bin:$${HOME}/.bun/bin:$${PATH}"
        expected_bun="$$(tr -d '[:space:]' < .bun-version)"
        if ! command -v bun >/dev/null 2>&1 || [ "$$(bun --version)" != "$${expected_bun}" ]; then
          curl -fsSL https://bun.sh/install | bash -s "bun-v$${expected_bun}"
        fi
        if [ -f "$$(git rev-parse --git-dir)/shallow" ]; then git fetch --unshallow; fi
        git fetch --tags origin "+refs/heads/main:refs/remotes/origin/main"
        GITHUB_MIRROR_TOKEN="$$(buildkite-agent secret get GITHUB_MIRROR_TOKEN)"
        [ -n "$${GITHUB_MIRROR_TOKEN}" ] || { echo "Empty GITHUB_MIRROR_TOKEN" >&2; exit 1; }
        export GITHUB_MIRROR_TOKEN
        bun run release:auto mirror
